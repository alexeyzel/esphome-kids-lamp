# Complete example. Keep your own identity and credentials locally.
esphome:
  name: kids-night-lamp
  friendly_name: Kids Night Lamp

esp32:
  variant: esp32s3
  flash_size: 8MB
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: Kids Night Lamp Fallback Hotspot
    password: !secret fallback_ap_password

captive_portal:

packages:
  kids_night_lamp: !include packages/lamp.yaml
